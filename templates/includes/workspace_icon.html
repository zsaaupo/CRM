<svg class="{{ icon_class }}" width="{{ size|default:20 }}" height="{{ size|default:20 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if icon == 'wallet' %}<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 5h2"/>
    {% elif icon == 'sales' %}<path d="M5 8h14l1 13H4L5 8Zm4 1V6a3 3 0 0 1 6 0v3"/>
    {% elif icon == 'stock' %}<path d="m21 8-9 5-9-5 9-5 9 5ZM3 8v8l9 5 9-5V8m-9 5v8"/>
    {% elif icon == 'users' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-4m-3-12a4 4 0 0 1 0 8"/><circle cx="9" cy="7" r="4"/>
    {% elif icon == 'check' %}<path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7l8-4Zm-4 9 3 3 5-6"/>
    {% elif icon == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
    {% elif icon == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    {% elif icon == 'plus' %}<path d="M12 5v14M5 12h14"/>
    {% elif icon == 'activity' %}<path d="M3 12h4l3-7 4 14 3-7h4"/>
    {% endif %}
</svg>
