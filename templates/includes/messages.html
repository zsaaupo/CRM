{% if messages %}
<div class="mx-auto w-full max-w-lg space-y-3 px-5 pt-4" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
    <div class="rounded-xl border px-4 py-3 text-sm leading-6 {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}border-red-200 bg-red-50 text-red-800{% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-stone-200 bg-white text-stone-700{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
