{% if menu %}
<button type="button" class="sidebar-sub-link sidebar-group-toggle sidebar-subgroup-toggle {% if hrm_group == group_key %}is-current{% endif %}" data-nav-toggle data-{{ group_key }}-toggle aria-controls="hrm-{{ group_key }}-submenu" aria-expanded="{% if hrm_group == group_key %}true{% else %}false{% endif %}">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        {% if group_key == 'attendance' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-12 6 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
        {% else %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M9 5V3h6v2M3 11h18M9 11v3h6v-3" stroke-linecap="round" stroke-linejoin="round"/>{% endif %}
    </svg>
    <span>{{ group_label }}</span>
    <svg class="sidebar-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div id="hrm-{{ group_key }}-submenu" class="sidebar-submenu sidebar-nested-submenu" {% if hrm_group != group_key %}hidden{% endif %}>
    {% with shortcut_key=add_key|default:group_key %}
    {% for item in menu %}
    <a href="{{ item.list_url }}" data-nav-item data-nav-list class="sidebar-sub-link {% if hrm_key == item.key and page_mode != 'add' %}is-current{% endif %}" {% if hrm_key == item.key and page_mode != 'add' %}aria-current="page"{% endif %}>{{ item.label }}</a>
    {% if item.key == shortcut_key and item.can_add %}<a href="{{ item.add_url }}" data-nav-item class="sidebar-sub-link {% if hrm_key == shortcut_key and page_mode == 'add' %}is-current{% endif %}" {% if hrm_key == shortcut_key and page_mode == 'add' %}aria-current="page"{% endif %}>{{ add_label }}</a>{% endif %}
    {% endfor %}
    {% endwith %}
</div>
{% endif %}
