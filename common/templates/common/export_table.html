<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ report.title }}</title>
    <style>
        body { font-family: sans-serif; color: #1f2937; font-size: 11px; margin: 18px; }
        header { display: flex; justify-content: space-between; border-bottom: 2px solid #111827; padding-bottom: 8px; margin-bottom: 14px; }
        h1 { margin: 0 0 4px 0; font-size: 18px; }
        .meta { color: #6b7280; font-size: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border: 1px solid #d1d5db; padding: 5px 7px; text-align: left; }
        th { background: #f3f4f6; font-weight: 600; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>{{ report.title }}</h1>
            <div class="meta">{{ report.company.name }} &middot; Generated {{ report.generated_at }}</div>
        </div>
        {% if is_print %}
        <button class="no-print" onclick="window.print()">Print</button>
        {% endif %}
    </header>
    <table>
        <thead>
            <tr>{% for col in report.headers %}<th>{{ col }}</th>{% endfor %}</tr>
        </thead>
        <tbody>
            {% for row in report.rows %}
            <tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>
            {% empty %}
            <tr><td colspan="{{ report.headers|length }}">No records found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
