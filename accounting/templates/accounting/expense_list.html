{% extends 'inventory/list.html' %}

{% block catalog_filters %}
<form class="border-b border-stone-200 px-5 py-4" data-catalog-filters aria-label="Filter {{ resource.plural }}">
    <div class="expense-filter-row">
        <div class="expense-filter-field">
            <label for="expense-from-date" class="form-label">From date</label>
            <input id="expense-from-date" name="from_date" type="date" class="form-input">
        </div>
        <div class="expense-filter-field">
            <label for="expense-to-date" class="form-label">To date</label>
            <input id="expense-to-date" name="to_date" type="date" class="form-input">
        </div>
        <div class="expense-filter-field">
            <label for="expense-category-filter" class="form-label">Category</label>
            <select id="expense-category-filter" name="category" class="form-input">
                <option value="">All categories</option>
                {% for category in filter_categories %}<option value="{{ category.pk }}">{{ category.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="expense-filter-field">
            <label for="expense-warehouse-filter" class="form-label">Warehouse</label>
            <select id="expense-warehouse-filter" name="warehouse" class="form-input">
                <option value="">All warehouses</option>
                {% for warehouse in filter_warehouses %}<option value="{{ warehouse.pk }}">{{ warehouse.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="expense-filter-actions">
            <button type="submit" class="secondary-button">Apply filters</button>
            <button type="reset" class="text-button">Clear filters</button>
        </div>
    </div>
    <p class="mt-3 font-semibold text-sm text-emerald-600" data-catalog-total="Total for matching {{ resource.plural }}" role="status" hidden></p>
</form>
{% endblock %}
